slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frame 
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint

    scan_topic: /scan
    mode: mapping


    resolution: 0.05              # delta: 0.05
    max_laser_range: 3.0          # maxUrange: 3.0
    map_update_interval: 2.0      # map_update_interval: 2.0
    minimum_travel_distance: 1.0  # linearUpdate: 1.0
    minimum_travel_heading: 0.2   # angularUpdate: 0.2

    map_start_at_dock: true

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_time_interval: 0.5    # temporalUpdate: 0.5

    use_sim_time: false
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000